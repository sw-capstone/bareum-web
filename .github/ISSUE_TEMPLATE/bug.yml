name: '🐛 Bug'
description: '오류를 제보하고 수정하는 작업에 사용합니다.'
title: '[Bug] '
labels: [':bug: bug']

body:
  - type: textarea
    id: description
    attributes:
      label: 어떤 버그인가요?
      description: 실제 발생한 문제와 영향을 설명해주세요.
      placeholder: |
        e.g. 분석이 완료되어도 결과 화면에 로딩 표시가 남아 분석 결과를 확인할 수 없습니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 요청이나 입력 데이터, 실행 순서를 적어주세요. 재현이 어렵다면 발생 당시 조건과 빈도를 적어주세요.
      placeholder: |
        e.g.

        1. 문서를 업로드하고 분석을 요청합니다.
        2. 분석 결과 화면으로 이동합니다.
        3. API 응답이 완료 상태인데도 화면에 로딩 표시가 계속 나타납니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상적으로 어떤 결과가 나와야 하나요?
      placeholder: |
        e.g. 분석이 완료되면 로딩 표시가 사라지고 분석 결과가 화면에 표시되어야 합니다.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 발생 환경 및 참고 자료
      description: 재현에 필요한 실행 환경, 버전, 입력·출력과 로그를 적어주세요. 파악한 원인이나 수정 방향도 함께 적고, 민감한 정보는 마스킹해주세요.
      placeholder: |
        e.g.

        - 발생 일시:
        - 브라우저 및 버전:
        - 운영체제 / 기기:
        - 화면 크기:
        - 발생 페이지 URL:
        - 스크린샷 또는 화면 녹화:
        - 브라우저 콘솔 오류 / 네트워크 응답:
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 확인사항
      options:
        - label: 동일하거나 유사한 이슈가 없는지 확인했습니다.
          required: true
        - label: 첨부한 입력·로그에 개인정보, 토큰 등 민감한 정보가 없는지 확인했습니다.
          required: true
        - label: 적절한 라벨과 Assignee를 설정했습니다.
          required: true
